<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>デザイン案の見比べ — 単語イメージ帳</title>
<link rel="icon" type="image/png" href="../icons/icon-192.png">
<!-- デザイン選び用の仮のページ。決まったら design/ フォルダごと消す -->
<style>
  body { margin: 0; background: #1b1b1d; color: #eee; font-family: "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", Meiryo, sans-serif; line-height: 1.7; }
  header { padding: 20px 20px 4px; max-width: 900px; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  header p { margin: 0 0 6px; font-size: 14px; color: #bbb; }
  .cols { display: flex; gap: 20px; padding: 16px 20px 40px; overflow-x: auto; align-items: flex-start; }
  .col { flex: none; width: 300px; }
  .col h2 { font-size: 18px; margin: 0; }
  .col p { margin: 4px 0 8px; font-size: 13px; color: #ccc; min-height: 6.8em; }
  .col a.try { display: block; margin-bottom: 12px; padding: 12px; background: #eee; color: #111; font-weight: 700; font-size: 14px; text-align: center; text-decoration: none; }
  .col h3 { font-size: 12px; font-weight: 400; color: #999; margin: 14px 0 4px; }
  .col img { display: block; width: 100%; height: auto; border: 1px solid #444; }
</style>
</head>
<body>
<header>
  <h1>デザイン案の見比べ</h1>
  <p>横に並んだ案を見比べてください(横にスクロールできます)。画像はスマホ幅(375px)の画面です。上から「単語詳細の一番上」「注意点・よくある型」「例文」「単語一覧」。</p>
  <p>「この案で実際に触る」を押すと、その案でアプリが開きます(次に普通に開いたときも同じ案のまま)。元に戻すには一番右の「今のデザイン」のボタンを押します。</p>
</header>
<div class="cols" id="cols"></div>
<script>
// 案の一覧(名前・一言の説明)。画像は shots/<案>-1-top.png など
var THEMES = [
  ['a', 'A ネオン', '黒に近い地に、シアンとマゼンタの細い発光線。端末のHUD風。線画が光り、注意点や例文は1件ずつ小さなパネルに分かれる。'],
  ['b', 'B 墨と金', '紺がかった墨色の地、生成りの文字、金色の極細線。中央ぞろえで静か。英字は優雅なセリフ体、番号は金の斜体。'],
  ['c', 'C 設計図', '濃紺の地に白〜水色の線と、うっすら方眼。見出しは図面のラベル、番号は丸い照合番号。線画が図面の一部に見える。'],
  ['d', 'D 深緑ポスター', '深い緑のベタ地に黄1色。巨大な英字と黄ベタの帯で、ポスターのように組む。線画と一言は画面の端から端まで。'],
  ['e', 'E ワインと珊瑚', '深いワイン色の地に珊瑚色1色。最初の1画面は「単語＋線画＋一言」だけ。続きは左の縦線に点を打ち、流れで読む。'],
  ['none', '今のデザイン(比較用)', '白地に黒の罫線だけの、今の見た目。']
];
var SHOTS = [['1-top', '単語詳細の一番上'], ['2-points', '注意点・よくある型'], ['3-examples', '例文'], ['4-list', '単語一覧']];
var cols = document.getElementById('cols');
THEMES.forEach(function (t) {
  var col = document.createElement('section');
  col.className = 'col';
  var html = '<h2>' + t[1] + '</h2><p>' + t[2] + '</p>' +
    '<a class="try" href="../index.html?theme=' + t[0] + '#/word/observe?list=trial">' + (t[0] === 'none' ? '今のデザインに戻して開く' : 'この案で実際に触る') + '</a>';
  SHOTS.forEach(function (s) {
    html += '<h3>' + s[1] + '</h3><img loading="lazy" src="shots/' + t[0] + '-' + s[0] + '.png" alt="' + t[1] + ':' + s[1] + '">';
  });
  col.innerHTML = html;
  cols.appendChild(col);
});
</script>
</body>
</html>
