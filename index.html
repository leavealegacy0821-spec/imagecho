<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#10131a">
<meta name="robots" content="noindex, nofollow">
<meta name="format-detection" content="telephone=no">
<!-- iPhone のホーム画面に追加したときの設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="単語イメージ帳">
<title>単語イメージ帳</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<!-- 見た目は「墨と金」に決定(style.css の上に重ねる) -->
<link rel="stylesheet" href="css/themes/b.css">
</head>
<body>
<div id="app">
  <!-- 題字と検索欄(単語集一覧・検索の画面でだけ見せる) -->
  <header id="masthead" hidden>
    <h1 class="title"><a href="#/">単語イメージ帳</a></h1>
    <form id="search-form" class="search" role="search" autocomplete="off">
      <label for="q" class="search-label">検索</label>
      <input id="q" class="search-input" type="search" inputmode="search" enterkeyhint="search"
             placeholder="英単語・日本語" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button type="button" id="q-clear" class="search-clear" hidden>消す</button>
    </form>
  </header>

  <!-- 画面の中身。js/app.js が書き換える -->
  <main id="view"><p class="note">読み込み中</p></main>

  <!-- オフライン用の保存の進み具合 -->
  <p id="sync" class="sync" hidden></p>
</div>

<!-- 単語詳細の画面下に固定する、前後移動とマークのボタン -->
<nav id="pager" class="pager" aria-label="前後の単語とマーク" hidden></nav>

<!-- 小さなお知らせ(読み上げ非対応など) -->
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<noscript><p class="note">このアプリは JavaScript を有効にして使います。</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
